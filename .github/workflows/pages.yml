name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
  deployments: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read deployment configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate private build reference
        id: build
        shell: bash
        run: |
          set -euo pipefail
          build_ref="$(cat build-ref)"
          [[ "$build_ref" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$build_ref" >> "$GITHUB_OUTPUT"
      - name: Read compiled site from private repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AyagawaSeirin/Blog-original
          ref: ${{ steps.build.outputs.sha }}
          ssh-key: ${{ secrets.PRIVATE_BUILD_READ_KEY }}
          persist-credentials: false
          path: _site
          fetch-depth: 1
      - name: Check compiled site boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test "$(cat _site/CNAME)" = blog.seir.in
          for forbidden in package.json _config.yml db.json source data node_modules; do
            test ! -e "_site/$forbidden"
          done
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
          retention-days: 1
      - name: Deploy current site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Remove temporary artifacts and older deployment records
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_RESULT: ${{ steps.deployment.outcome }}
        shell: python
        run: |
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = int(os.environ['GITHUB_RUN_ID'])
          def api(endpoint, method='GET', body=None):
              command = ['gh', 'api', '--method', method, endpoint]
              if body is not None: command.extend(['--input', '-'])
              output = subprocess.check_output(command, input=json.dumps(body) if body is not None else None, text=True)
              return json.loads(output) if output.strip() else None
          def pages(endpoint, key=None):
              result, page = [], 1
              while True:
                  data = api(f'{endpoint}?per_page=100&page={page}')
                  rows = data[key] if key else data
                  result.extend(rows)
                  if len(rows) < 100: return result
                  page += 1
          # Gather IDs before deleting so pagination cannot skip records.
          for artifact in pages(f'repos/{repo}/actions/artifacts', 'artifacts'):
              api(f'repos/{repo}/actions/artifacts/{artifact["id"]}', 'DELETE')
          for run in pages(f'repos/{repo}/actions/runs', 'workflow_runs'):
              if run['id'] != run_id and run['status'] == 'completed':
                  api(f'repos/{repo}/actions/runs/{run["id"]}', 'DELETE')
          # Pages may mark the previous deployment inactive asynchronously.
          # After a successful replacement, deactivate it explicitly before deletion.
          deployments = [d for d in pages(f'repos/{repo}/deployments') if d.get('environment') == 'github-pages']
          if os.environ['DEPLOYMENT_RESULT'] == 'success' and deployments:
              current_id = max(d['id'] for d in deployments)
              for deployment in deployments:
                  if deployment['id'] == current_id: continue
                  endpoint = f'repos/{repo}/deployments/{deployment["id"]}'
                  api(endpoint + '/statuses', 'POST', {'state': 'inactive', 'auto_inactive': False})
                  api(endpoint, 'DELETE')
          print('Temporary artifacts and completed older runs removed.')
